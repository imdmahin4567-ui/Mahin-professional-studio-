<style>
:root{--ink:#0B1B3F;--ink2:#15296B;--blue:#2457E6;--sun:#F5A524;--bg:#F4F6FB;--bd:#E1E6EF;--tx:#101828;--mut:#566074;--wa:#128C4A;--fb:#1877F2;--sh:0 10px 30px rgba(11,27,63,.09)}
*{box-sizing:border-box}
html{scroll-padding-top:110px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "Hind Siliguri",system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Sora","Hind Siliguri",sans-serif;line-height:1.3;margin:0}
a{color:inherit}.mut{color:var(--mut)}.w{max-width:1160px;margin:auto;padding:0 20px}
svg.ic{width:1.2em;height:1.2em;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:12px;padding:9px 16px;min-height:42px;font:600 15px "Hind Siliguri",sans-serif;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(11,27,63,.12)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}.btn.fb{background:var(--fb);border-color:var(--fb);color:#fff}
.btn.dg{color:#B42318}.btn.on{background:var(--ink);border-color:var(--ink);color:#fff}.btn.sm{min-height:34px;padding:5px 11px;font-size:14px;border-radius:9px}.btn.lg{min-height:50px;padding:12px 24px;font-size:17px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
/* top */
.promo{background:var(--sun);color:var(--ink);text-align:center;font-weight:600;font-size:14px;padding:7px 14px}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.nav{display:flex;align-items:center;gap:6px;padding:10px 20px;max-width:1160px;margin:auto}
.brand{display:flex;align-items:center;gap:10px;font:700 17px "Sora","Hind Siliguri";margin-right:auto;text-decoration:none;min-width:0}
.brand span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgo{height:40px;width:40px;border-radius:10px;background:var(--sun);color:var(--ink);display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}.lgo img{width:100%;height:100%;object-fit:contain;background:#fff}
.nav a.l{padding:6px 12px;border-radius:9px;text-decoration:none;font-size:15px}.nav a.l:hover{background:#ffffff1f}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;flex:none}.ib.wa{background:var(--wa)}.ib.fb{background:var(--fb)}.ib svg{width:20px;height:20px}
header .btn.lng{background:transparent;color:#fff;border-color:#ffffff40;min-height:36px;padding:4px 12px}
.mnav{display:none}
/* hero */
.hero{background:radial-gradient(1000px 420px at 85% -10%,#2a4bb8 0,transparent 60%),linear-gradient(160deg,var(--ink) 0,var(--ink2) 100%);color:#fff;padding:64px 0 70px;overflow:hidden}
.hg{display:grid;grid-template-columns:1.3fr 1fr;gap:44px;align-items:center}
.eyebrow{display:inline-block;background:#ffffff1a;border:1px solid #ffffff2e;color:#FFD98A;border-radius:99px;padding:4px 14px;font-size:14px;font-weight:600;margin-bottom:14px}
.hero h1{font-size:clamp(30px,5vw,52px);letter-spacing:-.5px}
.hero p.sub{max-width:560px;color:#CBD6F2;margin:16px 0 26px;font-size:17px}
.cta{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chipsr{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;color:#CBD6F2;font-size:14px}.chipsr b{display:block;color:#fff;font:700 24px "Sora"}
.hp{background:#ffffff12;border:1px solid #ffffff2b;border-top:4px solid var(--sun);border-radius:16px;padding:16px 18px;backdrop-filter:blur(4px)}
.hp>b{display:block;margin-bottom:6px}.hp .it{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 2px;border:0;border-bottom:1px solid #ffffff1f;background:none;color:#fff;font:inherit;width:100%;text-align:left;cursor:pointer}
.hp .it:last-child{border:0}.hp .it:hover{color:#FFD98A}.hp em{font-style:normal;color:#9FB0D8;font-size:14px;white-space:nowrap}
/* sections */
section{padding:62px 0}section.alt{background:#fff}
h2{font-size:clamp(22px,3.5vw,32px)}
.sh{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.sh p{margin:6px 0 0;color:var(--mut)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:11px;background:#fff;color:var(--tx);font:16px "Hind Siliguri",sans-serif}
.tools{display:flex;gap:10px;flex-wrap:wrap}.tools input{width:260px}.tools select{width:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;-webkit-overflow-scrolling:touch}.chips .btn{white-space:nowrap;padding:6px 15px;min-height:38px;border-radius:99px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.cat{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:18px 14px;text-align:center;text-decoration:none;transition:.2s;display:block}
.cat:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:#BFD0FA}.cat i{font-style:normal;font-size:34px;display:block;margin-bottom:6px}.cat b{display:block}.cat small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;animation:up .45s both;animation-delay:calc(var(--i,0)*45ms)}
.card:hover{transform:translateY(-5px);box-shadow:var(--sh)}
.im{height:150px;background:linear-gradient(135deg,#E8EEFC,#D6E2FF);display:grid;place-items:center;font-size:48px;position:relative;cursor:pointer;overflow:hidden}.im img{width:100%;height:100%;object-fit:cover;transition:transform .4s}.card:hover .im img{transform:scale(1.06)}
.bd{position:absolute;top:10px;left:10px;background:var(--sun);color:var(--ink);font:700 12px/1 "Hind Siliguri";padding:6px 9px;border-radius:6px;font-style:normal}
.bd.r{left:auto;right:10px;background:#D92D20;color:#fff}
.cb{padding:15px;display:flex;flex-direction:column;gap:6px;flex:1}.cb small{color:var(--mut)}.cb h3{font-size:17px}.cb p{margin:0;color:var(--mut);font-size:14px}
.pf{margin-top:auto;padding-top:8px}.pr{font:700 21px "Sora",sans-serif;color:var(--ink)}.old{color:var(--mut);margin-right:8px;font-size:15px}
.ca{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:8px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.st{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:18px}.st i{width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:700 17px "Sora";font-style:normal;margin-bottom:10px}.st b{display:block;font-size:17px}.st span{color:var(--mut);font-size:14px}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.why div{background:var(--bg);border-radius:16px;padding:20px}.why i{font-style:normal;font-size:30px}.why b{display:block;margin:6px 0 2px}.why span{color:var(--mut);font-size:14px}
.rvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.rvc{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:18px}.rvc .s{color:var(--sun);letter-spacing:2px;font-size:18px}.rvc p{margin:8px 0}
.soc{background:linear-gradient(135deg,var(--ink),var(--ink2));color:#fff;border-radius:22px;padding:34px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.soc h2{margin-bottom:6px}.soc p{margin:0;color:#CBD6F2}
.soc .bx{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
details{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:10px;max-width:800px}summary{cursor:pointer;font-weight:600}details p{margin:8px 0 0;color:var(--mut)}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.cc{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}.cc.t{border-top:4px solid var(--blue)}.cc.w{border-top:4px solid var(--wa)}.cc.f{border-top:4px solid var(--fb)}
.cc b{font-size:18px}.cc span{color:var(--mut)}.ex{margin-top:16px;color:var(--mut)}
footer{background:var(--ink);color:#B7C4E4;padding:30px 0;font-size:14px}footer .w{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}footer .fs{display:flex;gap:8px;align-items:center}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fab a{box-shadow:0 8px 22px #0004;text-decoration:none;color:#fff;display:flex;align-items:center;gap:8px;font-weight:700}
.fab .fw{background:var(--wa);border-radius:99px;padding:0 20px 0 14px;height:54px;animation:pls 2.4s infinite}.fab .ff{background:var(--fb);border-radius:50%;width:48px;height:48px;justify-content:center}
.fab svg{width:26px;height:26px}
@keyframes pls{0%{box-shadow:0 0 0 0 #128C4A88,0 8px 22px #0004}70%{box-shadow:0 0 0 16px #128C4A00,0 8px 22px #0004}100%{box-shadow:0 0 0 0 #128C4A00,0 8px 22px #0004}}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:99;display:none;max-width:90vw;text-align:center}
/* modal */
.modal{position:fixed;inset:0;background:#0B1B3F99;z-index:60;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:20px 12px}
.mb{background:#fff;border-radius:18px;max-width:560px;width:100%;padding:20px;margin:auto;animation:up .3s both}.mb.big{max-width:720px;padding:0;overflow:hidden}
.pv .hd{height:220px;background:linear-gradient(135deg,#E8EEFC,#D6E2FF);display:grid;place-items:center;font-size:72px;position:relative}.pv .hd img{width:100%;height:100%;object-fit:cover}
.pv .bo{padding:20px}.pv h2{font-size:24px;margin:4px 0 8px}.pv ul{padding-left:20px;margin:8px 0}.pv .ac{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.xb{position:absolute;top:10px;right:10px;background:#fff;border:0;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;box-shadow:0 2px 8px #0003}
/* admin */
.ah{background:var(--ink);color:#fff;display:flex;gap:10px;align-items:center;padding:12px 20px;position:sticky;top:0;z-index:20}.ah b{margin-right:auto;font-size:17px}.ah .btn{min-height:36px;padding:5px 12px}
.adm{display:grid;grid-template-columns:232px 1fr;gap:20px;max-width:1200px;margin:auto;padding:20px}
.side{position:sticky;top:76px;align-self:start;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px}
.side button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;font:600 15px "Hind Siliguri";cursor:pointer;color:var(--tx)}
.side button:hover{background:var(--bg)}.side button.on{background:var(--ink);color:#fff}
.pn{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px}.pn h3{font-size:18px;margin-bottom:4px}.pn>p{margin:0 0 12px;color:var(--mut);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px 16px}.stat b{display:block;font:700 28px "Sora";color:var(--ink)}.stat span{color:var(--mut);font-size:14px}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.ck2{list-style:none;margin:0;padding:0}.ck2 li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.ck2 li:last-child{border:0}.ck2 .ok{color:var(--wa)}.ck2 .no{color:#B54708}.ck2 .btn{margin-left:auto}
.rw{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}.rw .g1{flex:1;min-width:170px}
.th{width:50px;height:50px;border-radius:10px;background:#E8EEFC;display:grid;place-items:center;overflow:hidden;font-size:24px;flex:none}.th img{width:100%;height:100%;object-fit:cover}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#EEF2FA;color:var(--mut);margin-right:4px}.pill.ok{background:#DCFAE6;color:#067647}.pill.off{background:#FEE4E2;color:#B42318}.pill.pop{background:#FEF0C7;color:#93370D}
.ra{display:flex;gap:6px;flex-wrap:wrap}
label{display:block;margin:12px 0 4px;font-size:14px;color:var(--mut);font-weight:500}label.ck{display:flex;gap:8px;align-items:center;color:var(--tx)}label.ck input{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.lgn{max-width:400px;margin:auto;padding:64px 20px}.lgn .pn{padding:26px}
.hint{font-size:13px;color:var(--mut);margin-top:4px}
@media(max-width:860px){.adm{grid-template-columns:1fr;padding:14px}.side{position:static;flex-direction:row;overflow-x:auto}.side button{white-space:nowrap}}
@media(max-width:760px){
.hg,.soc{grid-template-columns:1fr}.soc .bx{justify-content:flex-start}
.nav a.l{display:none}.hero{padding:40px 0 46px}section{padding:44px 0}.two{grid-template-columns:1fr}
.mnav{display:flex;gap:4px;overflow-x:auto;padding:0 14px 8px;background:var(--ink)}.mnav a{color:#fff;text-decoration:none;font-size:14px;padding:5px 12px;border-radius:99px;background:#ffffff1a;white-space:nowrap}
.tools input{width:100%}.fab .fw span{display:none}.fab .fw{width:54px;padding:0;justify-content:center}.soc{padding:24px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card,.mb,.fab .fw{animation:none}*{transition:none!important}}
